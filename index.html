<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b31d1d">
<title>红包上写什么 · 题字、落款、备注、那句话</title>
<meta name="description" content="选场合、选关系，立刻给出红包封面题字、落款写法、背面小字、微信备注和见面那句，还能生成图片存手机。离线可用。">
<meta property="og:title" content="红包上写什么">
<meta property="og:description" content="结婚、满月、升学、乔迁、过寿、白事、探病——照着抄就行。">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --fg:#1c1a19; --muted:#6f6a66; --line:rgba(28,26,25,.14);
    --red:#b31d1d; --red-2:#8d1414; --gold:#c8a24a; --paper:#fbf8f3;
    --bg:#f6f2ea;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  body{padding:18px 16px calc(28px + env(safe-area-inset-bottom))}
  .wrap{max-width:520px;margin:0 auto}
  header{margin-bottom:16px}
  h1{font-size:22px;margin:0 0 6px;letter-spacing:.5px;font-weight:700}
  .lede{font-size:13px;line-height:1.65;color:var(--muted);margin:0}

  .field{margin:16px 0 0}
  .field > .lab{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
  .lab .n{width:17px;height:17px;border-radius:50%;background:var(--red);color:#fff;
    font-size:11px;display:grid;place-items:center;font-weight:600;flex:0 0 auto}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:#fff;color:var(--fg);border-radius:22px;
    padding:8px 13px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:.14s;line-height:1}
  .chip:hover{border-color:var(--red)}
  .chip[aria-pressed="true"]{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 1px 6px rgba(179,29,29,.25)}
  .chip.w[aria-pressed="true"]{background:#3b3b41;border-color:#3b3b41;box-shadow:none}

  input[type=text]{width:100%;max-width:260px;padding:10px 12px;border:1px solid var(--line);
    border-radius:10px;background:#fff;color:var(--fg);font-size:14px;font-family:inherit;outline:none}
  input[type=text]:focus{border-color:var(--red)}

  /* 预览卡 */
  .preview{margin-top:20px;display:flex;justify-content:center}
  .card{
    position:relative;width:100%;max-width:300px;aspect-ratio:3/4.15;border-radius:12px;
    background:linear-gradient(160deg,#c62828 0%,#a31616 55%,#8a1010 100%);
    box-shadow:0 10px 26px rgba(120,12,12,.28),inset 0 0 0 1px rgba(255,255,255,.1);
    overflow:hidden;display:flex;flex-direction:column;align-items:center;
    padding:16px 14px 14px;transition:.2s;
  }
  .card.w{background:linear-gradient(160deg,#fbfaf6,#eee9dd);box-shadow:0 10px 24px rgba(60,55,45,.16)}
  .card::after{content:"";position:absolute;inset:9px;border:1px solid rgba(255,235,180,.4);border-radius:7px;pointer-events:none}
  .card.w::after{border-color:rgba(120,110,90,.3)}
  .card .top{font-size:11px;letter-spacing:2px;color:rgba(255,235,180,.75);z-index:1}
  .card.w .top{color:rgba(90,80,65,.7)}
  .card .seal{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;
    border:1px solid rgba(255,235,180,.45);display:grid;place-items:center;font-size:9px;
    color:rgba(255,240,200,.8);letter-spacing:0;line-height:1.1;text-align:center;z-index:1}
  .card.w .seal{border-color:rgba(150,40,40,.35);color:rgba(150,40,40,.75)}
  .title{writing-mode:vertical-rl;text-orientation:upright;font-family:"Songti SC","STSong","SimSun",serif;
    font-size:40px;line-height:1.28;letter-spacing:8px;font-weight:700;color:#ffeab6;
    text-shadow:0 2px 10px rgba(0,0,0,.28);margin:auto;padding-left:8px}
  .card.w .title{color:#23211f;text-shadow:none}
  .sign{writing-mode:vertical-rl;text-orientation:upright;position:absolute;right:26px;bottom:26px;
    font-family:"Songti SC","STSong","SimSun",serif;font-size:12.5px;letter-spacing:3px;
    color:rgba(255,240,205,.82);z-index:1}
  .card.w .sign{color:rgba(70,65,55,.75)}
  .back{position:absolute;left:26px;bottom:26px;font-size:10.5px;color:rgba(255,235,190,.62);
    writing-mode:vertical-rl;letter-spacing:2px;z-index:1;max-height:60%}
  .card.w .back{color:rgba(90,80,65,.6)}

  /* 结果行 */
  .result{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .row{display:flex;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.65}
  .row:last-child{border-bottom:0}
  .row .k{flex:0 0 68px;font-size:12px;color:var(--muted);padding-top:2px}
  .row .v{flex:1}
  .row.warn .v{color:#9b2c14}

  .actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
  .btn{flex:1 1 auto;min-width:120px;border:1px solid var(--line);background:#fff;color:var(--fg);
    border-radius:11px;padding:12px 14px;font-size:14px;font-family:inherit;cursor:pointer;transition:.14s}
  .btn:hover{border-color:var(--red)}
  .btn.primary{background:var(--red);color:#fff;border-color:var(--red);font-weight:600}
  .btn.ghost{flex:0 0 auto;min-width:0;background:transparent;border-color:transparent;color:var(--muted);
    text-decoration:underline;text-underline-offset:3px}
  .note{margin-top:14px;font-size:11.5px;line-height:1.7;color:var(--muted)}
  .note b{color:var(--fg)}

  /* 图片弹层 */
  .sheet{position:fixed;inset:0;background:rgba(20,18,16,.86);display:none;z-index:50;
    place-items:center;padding:20px;overflow:auto}
  .sheet.on{display:grid}
  .sheet .inner{max-width:340px;width:100%;text-align:center}
  .sheet img{width:100%;border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.5);display:block}
  .sheet .tip{color:#e8e2d8;font-size:12.5px;margin:12px 0 10px;line-height:1.6}
  .sheet .close{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;
    border-radius:9px;padding:9px 18px;font-size:13px;font-family:inherit;cursor:pointer}
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);opacity:0;
    background:#26221f;color:#fff;font-size:13px;padding:9px 16px;border-radius:22px;
    transition:.24s;pointer-events:none;z-index:60;white-space:nowrap}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  @media (max-width:380px){ .title{font-size:34px;letter-spacing:6px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>红包上写什么</h1>
    <p class="lede">选场合、选关系 —— 题字、落款、背面小字、微信备注、见面那句，一次给全。可以生成图片存手机。</p>
  </header>

  <div class="field">
    <div class="lab"><span class="n">1</span>什么场合</div>
    <div class="chips" id="occ"></div>
  </div>

  <div class="field">
    <div class="lab"><span class="n">2</span>和对方什么关系</div>
    <div class="chips" id="rel"></div>
  </div>

  <div class="field">
    <div class="lab"><span class="n">3</span>落款写谁（可留空）</div>
    <input type="text" id="signer" maxlength="14" placeholder="王磊 / 王磊 全家" autocomplete="off" enterkeyhint="done">
  </div>

  <div class="preview">
    <div class="card" id="card">
      <div class="top" id="cardTop">结 婚</div>
      <div class="seal" id="seal">敬<br>贺</div>
      <div class="title" id="bigTitle">新婚大喜</div>
      <div class="back" id="backText"></div>
      <div class="sign" id="signText"></div>
    </div>
  </div>

  <div class="result">
    <div class="row"><div class="k">封面题字</div><div class="v" id="rTitle"></div></div>
    <div class="row"><div class="k">落款</div><div class="v" id="rSign"></div></div>
    <div class="row"><div class="k">背面小字</div><div class="v" id="rBack"></div></div>
    <div class="row"><div class="k">微信备注</div><div class="v" id="rWx"></div></div>
    <div class="row"><div class="k">见面那句</div><div class="v" id="rSay"></div></div>
    <div class="row warn"><div class="k">别踩的坑</div><div class="v" id="rTaboo"></div></div>
  </div>

  <div class="actions">
    <button class="btn primary" id="btnImg">生成图片</button>
    <button class="btn" id="btnCopy">复制文字</button>
    <button class="btn" id="btnReroll">换个题字</button>
    <button class="btn ghost" id="btnShare">分享给同去的人</button>
  </div>

  <p class="note">
    <b>关于准确性的实话</b>：题字是比较通行的写法，但各地风俗差别很大——金额单双、信封颜色、能不能空手进门、白事具体规矩，都按当地来。<b>拿不准，问一句同去的人，比查任何攻略都准。</b>
  </p>
</div>

<div class="sheet" id="sheet">
  <div class="inner">
    <img id="shot" alt="红包卡片">
    <div class="tip">长按图片保存到相册（微信里也能长按保存）</div>
    <button class="close" id="btnClose">关闭</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var OCCASIONS = [
    { id:"marry", label:"结婚", top:"结 婚", seal:"敬贺", tone:"red",
      titles:["新婚大喜","百年好合","天作之合","佳偶天成","琴瑟和鸣","永结同心","珠联璧合","喜结良缘"],
      back:["聊表心意 敬请笑纳","薄礼一份 恭贺新禧","一点心意 共贺佳期"],
      wx:{formal:"新婚大喜，一点心意，祝二位百年好合。",family:"新婚大喜！家里的一点心意，祝你们日子红红火火。",casual:"新婚大喜啊！红包不大心意到了，早生贵子～"},
      say:{formal:"恭喜恭喜，祝二位幸福美满。",family:"真替你们高兴，往后好好过日子。",casual:"终于把你嫁/娶出去了！恭喜恭喜～"},
      taboo:"别写「生日快乐」「恭喜发财」。金额避开 4，喜事一般取双数（各地不同，随当地）。" },

    { id:"baby", label:"生孩子 / 满月", top:"添 丁", seal:"敬贺", tone:"red",
      titles:["喜得贵子","喜得千金","长命百岁","茁壮成长","弄璋之喜","弄瓦之喜","麟趾呈祥"],
      back:["聊表心意 祝宝宝安康","一点心意 贺弄璋之喜","薄礼一份 愿长命百岁"],
      wx:{formal:"恭喜添丁，一点心意，祝宝宝健康平安。",family:"恭喜恭喜！给娃的一点心意，长得壮壮实实。",casual:"恭喜升级当爸/妈！红包给娃买奶粉～"},
      say:{formal:"恭喜，母子平安就是最大的福气。",family:"孩子长得真好，像你们！",casual:"以后有的忙了哈哈，恭喜恭喜！"},
      taboo:"「喜得贵子／弄璋」只用于男孩，「喜得千金／弄瓦」只用于女孩，写反很难看；不确定就写「长命百岁」。" },

    { id:"school", label:"升学 / 高考", top:"升 学", seal:"敬贺", tone:"red",
      titles:["金榜题名","学业有成","前程似锦","鹏程万里","蟾宫折桂","步步高升"],
      back:["聊表心意 贺金榜题名","一点心意 祝前程似锦"],
      wx:{formal:"金榜题名，一点心意，祝学业更上一层。",family:"考上啦！家里给你添个彩头，好好念。",casual:"牛啊！红包拿去，别全买奶茶。"},
      say:{formal:"恭喜，这些年辛苦了。",family:"给咱家争气了！",casual:"请客啊！这顿得你请。"},
      taboo:"别写「恭喜发财」「生意兴隆」。升学宴上也别把话说成「以后挣大钱」，长辈不爱听。" },

    { id:"move", label:"乔迁 / 搬家", top:"乔 迁", seal:"敬贺", tone:"red",
      titles:["乔迁之喜","华堂生辉","新居纳福","安居乐业","福地呈祥","栋宇维新"],
      back:["聊表心意 贺乔迁之喜","薄礼一份 愿安居乐业"],
      wx:{formal:"乔迁之喜，一点心意，祝新居安顺。",family:"搬新家啦！给你添个彩头，日子越过越好。",casual:"乔迁大喜！暖房那天记得叫我。"},
      say:{formal:"恭喜乔迁，新居一定顺顺利利。",family:"这房子亮堂，住着踏实。",casual:"终于不用爬六楼了吧哈哈。"},
      taboo:"部分地区搬家忌「一路顺风」（有散之意）；要不要带东西进门、先迈哪只脚，各地讲究不同，跟着主家来。" },

    { id:"birthday", label:"过寿（60 岁以上）", top:"寿 宴", seal:"敬贺", tone:"red",
      titles:["福如东海","寿比南山","松鹤延年","福寿康宁","康乐颐年","德高望重"],
      back:["聊表心意 恭祝寿辰","薄礼一份 愿福寿康宁"],
      wx:{formal:"恭祝寿辰，一点心意，祝您福寿康宁。",family:"给您过寿，全家一点心意，您身体好比什么都强。",casual:"生日快乐！您这身体比我们年轻人都硬朗。"},
      say:{formal:"祝您福寿绵长。",family:"您得多活几十年，我们还得靠您呢。",casual:"生日快乐，越活越年轻！"},
      taboo:"「寿」只用于上了年纪的人（一般 60 岁以上），三四十岁生日写「寿比南山」会尴尬；给很高龄的老人别写「长命百岁」，部分地区视为不敬。" },

    { id:"open", label:"开业", top:"开 业", seal:"敬贺", tone:"red",
      titles:["开业大吉","生意兴隆","财源广进","客似云来","骏业日新","利路亨通"],
      back:["聊表心意 贺开业大吉","薄礼一份 愿生意兴隆"],
      wx:{formal:"开业大吉，一点心意，祝生意兴隆。",family:"开张啦！给你讨个彩头，稳稳当当。",casual:"开业大吉！以后我常来，记得打折。"},
      say:{formal:"祝贵号生意兴隆。",family:"开张头一天，图个热闹。",casual:"祝爆单！"},
      taboo:"别送白色花篮；祝贺话里避开「亏」「关」「倒」谐音。" },

    { id:"funeral", label:"白事", top:"奠", seal:"敬挽", tone:"white",
      titles:["奠仪","沉痛悼念","音容宛在","德范长存","驾鹤西去"],
      back:["谨具薄仪 伏惟尚飨","聊表哀思 敬请节哀"],
      wx:{formal:"惊闻噩耗，深表哀悼，一点心意，请节哀。",family:"听说了，心里难受。这点心意你先收着，有事招呼我。",casual:"我刚知道，节哀。需要跑腿的说一声。"},
      say:{formal:"请节哀，保重身体。",family:"别硬撑着，有事喊我们。",casual:"我过来了，你别管我。"},
      taboo:"白事用素色信封，绝不能用红封；题字写「奠仪」，不能出现「喜」「恭喜」；当面别说「再见」，走时别送出门。" },

    { id:"sick", label:"探病 / 住院", top:"探 望", seal:"敬祝", tone:"white",
      titles:["早日康复","康复如意","平安顺遂"],
      back:["聊表心意 祝早日康复","一点心意 愿平安顺遂"],
      wx:{formal:"一点心意，祝早日康复。",family:"别惦记钱的事，先把身体养好。",casual:"快点好起来，还等着你请吃饭。"},
      say:{formal:"祝您早日康复。",family:"好好养，别急着出院。",casual:"看着精神多了，没事。"},
      taboo:"别写「恭喜」「大吉」；别送梨（离）、钟（终）、白菊；尽量上午去，别久坐，别问病情细节。" }
  ];

  var RELATIONS = [
    { id:"colleague", label:"同事",    tone:"formal" },
    { id:"boss",      label:"领导",    tone:"formal" },
    { id:"friend",    label:"同学 / 朋友", tone:"casual" },
    { id:"relative",  label:"亲戚",    tone:"family" },
    { id:"neighbor",  label:"邻居",    tone:"formal" },
    { id:"junior",    label:"晚辈",    tone:"family" }
  ];

  var $ = function(s){ return document.querySelector(s); };
  var state = { occ:"marry", rel:"colleague", ti:0 };

  function findOcc(id){ for(var i=0;i<OCCASIONS.length;i++){ if(OCCASIONS[i].id===id) return OCCASIONS[i]; } return OCCASIONS[0]; }
  function findRel(id){ for(var i=0;i<RELATIONS.length;i++){ if(RELATIONS[i].id===id) return RELATIONS[i]; } return RELATIONS[0]; }

  /* ---------- URL / 本地记忆 ---------- */
  function readInit(){
    try{
      var h = location.hash.replace(/^#/,"");
      if(h){
        var p = {};
        h.split("&").forEach(function(kv){ var a=kv.split("="); if(a[0]) p[a[0]]=decodeURIComponent(a[1]||""); });
        if(p.o) state.occ = findOcc(p.o).id;
        if(p.r) state.rel = findRel(p.r).id;
      }
    }catch(e){}
    try{
      var saved = JSON.parse(localStorage.getItem("hb.state")||"null");
      if(saved && !location.hash){
        state.occ = findOcc(saved.occ).id;
        state.rel = findRel(saved.rel).id;
        if(saved.signer) $("#signer").value = saved.signer;
      }
    }catch(e){}
  }
  function save(){
    try{ localStorage.setItem("hb.state", JSON.stringify({occ:state.occ, rel:state.rel, signer:$("#signer").value})); }catch(e){}
  }
  function syncHash(){
    var h = "#o=" + state.occ + "&r=" + state.rel;
    try{ history.replaceState(null,"",h); }catch(e){}
  }

  /* ---------- 渲染 ---------- */
  function buildChips(){
    var occ = $("#occ"), rel = $("#rel");
    OCCASIONS.forEach(function(o){
      var b = document.createElement("button");
      b.type="button"; b.className="chip"+(o.tone==="white"?" w":"");
      b.textContent = o.label; b.dataset.id = o.id;
      b.addEventListener("click", function(){ state.occ=o.id; state.ti=0; syncChips(); render(); save(); });
      occ.appendChild(b);
    });
    RELATIONS.forEach(function(r){
      var b = document.createElement("button");
      b.type="button"; b.className="chip"; b.textContent = r.label; b.dataset.id = r.id;
      b.addEventListener("click", function(){ state.rel=r.id; syncChips(); render(); save(); });
      rel.appendChild(b);
    });
  }
  function syncChips(){
    [].forEach.call(document.querySelectorAll("#occ .chip"), function(c){ c.setAttribute("aria-pressed", c.dataset.id===state.occ); });
    [].forEach.call(document.querySelectorAll("#rel .chip"), function(c){ c.setAttribute("aria-pressed", c.dataset.id===state.rel); });
  }

  function current(){
    var o = findOcc(state.occ), r = findRel(state.rel);
    var title = o.titles[state.ti % o.titles.length];
    var signer = ($("#signer").value||"").trim();
    var sign = signer ? (signer + " " + o.seal) : "";
    var back = o.back[state.ti % o.back.length];
    return {
      o:o, r:r, title:title, signer:signer, sign:sign, back:back,
      wx: o.wx[r.tone] || o.wx.formal,
      say: o.say[r.tone] || o.say.formal
    };
  }

  function render(){
    var c = current();
    $("#cardTop").textContent = c.o.top;
    $("#seal").innerHTML = c.o.seal.charAt(0) + "<br>" + c.o.seal.charAt(1);
    $("#bigTitle").textContent = c.title;
    $("#backText").textContent = c.back;
    $("#signText").textContent = c.sign;
    $("#card").className = "card" + (c.o.tone==="white" ? " w" : "");

    $("#rTitle").textContent = c.title;
    $("#rSign").textContent = c.signer ? (c.signer + " " + c.o.seal) : ("你的名字 + " + c.o.seal + "（" + (c.o.id==="funeral"?"也有写「" + c.signer + " 携全家 敬挽」的":"也可以写「XX 全家 敬贺」") + "）");
    $("#rBack").textContent = c.back;
    $("#rWx").textContent = c.wx;
    $("#rSay").textContent = c.say;
    $("#rTaboo").textContent = c.o.taboo;

    window.__plain = "【" + c.o.label + "】\n封面题字：" + c.title + "\n落款：" + (c.sign || "你的名字 " + c.o.seal) +
      "\n背面小字：" + c.back + "\n微信备注：" + c.wx + "\n见面说：" + c.say + "\n注意：" + c.o.taboo;

    syncHash();
  }

  /* ---------- 生成图片 ---------- */
  function drawCard(){
    var c = current();
    var W = 750, H = 1038;
    var cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    var g = cv.getContext("2d");
    var white = c.o.tone === "white";

    // 底色
    if(white){
      var lg = g.createLinearGradient(0,0,W,H);
      lg.addColorStop(0,"#fcfbf7"); lg.addColorStop(1,"#eee9dd");
      g.fillStyle = lg; g.fillRect(0,0,W,H);
    }else{
      var rg = g.createRadialGradient(W*0.5,H*0.32,60, W*0.5,H*0.5,W*0.85);
      rg.addColorStop(0,"#cd3030"); rg.addColorStop(0.55,"#a81717"); rg.addColorStop(1,"#7d0e0e");
      g.fillStyle = rg; g.fillRect(0,0,W,H);
    }

    // 内框
    g.strokeStyle = white ? "rgba(120,110,90,.35)" : "rgba(255,232,170,.42)";
    g.lineWidth = 2;
    g.strokeRect(26.5,26.5,W-53,H-53);

    // 顶部场合
    g.fillStyle = white ? "rgba(90,80,65,.72)" : "rgba(255,236,180,.8)";
    g.font = "500 26px system-ui,'PingFang SC','Microsoft YaHei',sans-serif";
    g.textAlign = "center";
    g.fillText(c.o.top, W/2, 96);

    // 竖排题字
    var chars = c.title.split("");
    var fs = chars.length <= 4 ? 108 : (chars.length <= 5 ? 96 : 84);
    var gap = fs * 1.16;
    var totalH = gap * chars.length;
    var startY = (H - totalH) / 2 + gap * 0.78;
    g.font = "700 " + fs + "px 'Songti SC','STSong','SimSun',serif";
    g.textAlign = "center";
    g.textBaseline = "alphabetic";
    for(var i=0;i<chars.length;i++){
      var y = startY + i*gap;
      if(white){ g.fillStyle = "#23211f"; }
      else{
        g.shadowColor = "rgba(0,0,0,.35)"; g.shadowBlur = 16; g.shadowOffsetY = 3;
        g.fillStyle = "#ffeab6";
      }
      g.fillText(chars[i], W/2 - 34, y);
      g.shadowColor = "transparent"; g.shadowBlur = 0; g.shadowOffsetY = 0;
    }

    // 落款（右侧竖排）
    if(c.sign){
      g.font = "400 30px 'Songti SC','STSong','SimSun',serif";
      g.fillStyle = white ? "rgba(70,65,55,.78)" : "rgba(255,242,208,.9)";
      var sChars = c.sign.split("");
      var sy = H - 92;
      for(var j=0;j<sChars.length;j++){
        g.fillText(sChars[j], W - 122, sy - (sChars.length-1-j)*34);
      }
    }

    // 背面小字（左侧竖排，小）
    g.font = "400 24px 'Songti SC','STSong','SimSun',serif";
    g.fillStyle = white ? "rgba(90,80,65,.62)" : "rgba(255,236,190,.7)";
    var bChars = c.back.replace(/ /g,"").split("");
    var by = H - 110;
    for(var k=0;k<bChars.length && k<16;k++){
      g.fillText(bChars[k], 122, by - (Math.min(bChars.length,16)-1-k)*27);
    }

    // 小印
    g.beginPath();
    g.arc(W-72, 84, 30, 0, Math.PI*2);
    g.strokeStyle = white ? "rgba(150,40,40,.4)" : "rgba(255,235,190,.5)";
    g.lineWidth = 1.5; g.stroke();
    g.font = "500 22px 'Songti SC','STSong','SimSun',serif";
    g.fillStyle = white ? "rgba(150,40,40,.8)" : "rgba(255,240,205,.85)";
    g.fillText(c.o.seal.charAt(0), W-72, 78);
    g.fillText(c.o.seal.charAt(1), W-72, 102);

    return cv;
  }

  function showImage(){
    var cv = drawCard();
    var url = cv.toDataURL("image/png");
    $("#shot").src = url;
    $("#sheet").classList.add("on");
  }

  /* ---------- 交互 ---------- */
  function toast(msg){
    var t = $("#toast"); t.textContent = msg; t.classList.add("on");
    clearTimeout(window.__tt); window.__tt = setTimeout(function(){ t.classList.remove("on"); }, 1600);
  }

  $("#signer").addEventListener("input", function(){ render(); save(); });
  $("#btnReroll").addEventListener("click", function(){ state.ti++; render(); });
  $("#btnImg").addEventListener("click", showImage);
  $("#btnClose").addEventListener("click", function(){ $("#sheet").classList.remove("on"); });
  $("#sheet").addEventListener("click", function(e){ if(e.target === this) this.classList.remove("on"); });

  $("#btnCopy").addEventListener("click", function(){
    var txt = window.__plain;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast("已复制"); }, function(){ fallbackCopy(txt); });
    }else{ fallbackCopy(txt); }
  });
  function fallbackCopy(txt){
    var ta = document.createElement("textarea");
    ta.value = txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("已复制"); }catch(e){ toast("复制失败，请长按选择文字"); }
    document.body.removeChild(ta);
  }

  $("#btnShare").addEventListener("click", function(){
    var base = location.href.split("#")[0];
    var url = base + "#o=" + state.occ + "&r=" + state.rel;
    var shareData = { title:"红包上写什么", text:"这个场合该写什么，直接看：", url:url };
    if(navigator.share){
      navigator.share(shareData).catch(function(){});
    }else if(navigator.clipboard){
      navigator.clipboard.writeText(url).then(function(){ toast("链接已复制，发给同去的人"); }, function(){ toast(url); });
    }else{ toast(url); }
  });

  /* ---------- 启动 ---------- */
  readInit();
  buildChips();
  syncChips();
  render();
  syncHash();

  // 离线缓存（仅在通过 http(s) 打开时生效）
  if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
